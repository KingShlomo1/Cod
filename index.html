<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gibush: Iron Selection</title>
<style>
:root {
  --bg:#050a05; --panel:#0c140c; --border:#1a3318;
  --txt:#8fc48f; --dim:#3a5a3a;
  --G:#00ff41; --Y:#ffe600; --O:#ff8c00; --R:#ff2a2a; --B:#00aaff; --C:#00ffcc;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Courier New',monospace;background:var(--bg);color:var(--txt);
  height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  max-width:600px;margin:0 auto;position:relative}
body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);
  pointer-events:none;z-index:999}
.screen{display:none;flex-direction:column;height:100%;padding:10px;gap:5px;overflow:hidden}
.screen.active{display:flex}

/* INTRO */
#sc-intro{justify-content:center;align-items:center;text-align:center;gap:16px}
.logo-box{border:1px solid var(--G);padding:18px 32px;
  box-shadow:0 0 24px rgba(0,255,65,.2),inset 0 0 20px rgba(0,255,65,.05)}
.logo-title{font-size:2.2rem;font-weight:bold;color:var(--G);letter-spacing:10px;
  text-shadow:0 0 16px var(--G)}
.logo-sub{font-size:.7rem;color:var(--dim);letter-spacing:5px;margin-top:4px}
.briefing{font-size:.78rem;max-width:460px;line-height:1.75;color:var(--txt);min-height:72px}
.cursor{display:inline-block;width:7px;height:13px;background:var(--G);
  vertical-align:middle;animation:blink .6s infinite}
@keyframes blink{50%{opacity:0}}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px}
.hs-label{font-size:.65rem;color:var(--dim);letter-spacing:1px}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;
  padding:5px 10px;background:var(--panel);border:1px solid var(--border);
  border-radius:3px;font-size:.7rem;flex-shrink:0}
.hud-phase{font-weight:bold;letter-spacing:2px}
.hud-time{color:var(--dim)}

/* TERRAIN */
.terrain{background:var(--panel);border:1px solid var(--border);
  border-radius:3px;padding:3px 8px;flex-shrink:0}
.terrain-sky{color:var(--dim);font-size:.65rem;text-align:center;
  letter-spacing:4px;height:14px;overflow:hidden}
.terrain-ground{font-size:.85rem;letter-spacing:1px;white-space:nowrap;overflow:hidden;height:16px}

/* STATS */
.stats{background:var(--panel);border:1px solid var(--border);
  border-radius:3px;padding:7px 10px;flex-shrink:0}
.stat{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.stat:last-child{margin-bottom:0}
.sl{width:36px;font-size:.62rem;color:var(--dim);letter-spacing:1px;flex-shrink:0}
.sb{flex:1;height:12px;background:#020702;border:1px solid #111e11;
  border-radius:1px;overflow:hidden}
.sf{height:100%;border-radius:1px;transition:width .35s ease}
.sf::after{content:'';display:block;height:35%;background:rgba(255,255,255,.12)}
.sf-dist{background:linear-gradient(90deg,#00cc33,#00ff41)}
.sf-stam{background:linear-gradient(90deg,#cc9900,#ffe600)}
.sf-hydr{background:linear-gradient(90deg,#0077bb,#00aaff)}
.sf-grit{background:linear-gradient(90deg,#bb1100,#ff3311)}
.sf-nutr{background:linear-gradient(90deg,#337733,#66bb66)}
.sf-temp{background:linear-gradient(90deg,#0088aa,#ff4400)}
.sv{width:44px;font-size:.62rem;text-align:right;flex-shrink:0}
.stat.crit .sf{animation:pulseD .7s infinite}
.stat.warn .sf{animation:pulseW 1.1s infinite}
@keyframes pulseD{50%{opacity:.45;filter:brightness(1.5)}}
@keyframes pulseW{50%{opacity:.65}}

/* STATUS EFFECTS */
.effects{display:flex;gap:5px;flex-wrap:wrap;min-height:18px;flex-shrink:0}
.eff{font-size:.58rem;padding:1px 5px;border-radius:2px;border:1px solid currentColor;
  letter-spacing:1px;animation:effIn .3s ease}
@keyframes effIn{from{opacity:0;transform:scale(.7)}}
.eff-bad{color:var(--R)} .eff-good{color:var(--G)} .eff-neutral{color:var(--B)}

/* EQUIPMENT */
.equip{display:flex;gap:10px;flex-wrap:wrap;padding:5px 10px;
  background:var(--panel);border:1px solid var(--border);border-radius:3px;
  font-size:.68rem;flex-shrink:0;align-items:center}
.eq{display:flex;align-items:center;gap:3px}
.eq-lbl{color:var(--dim)}
.eq-val{color:var(--Y);font-weight:bold}
.eq-val.zero{color:var(--R)}
.eq-score{margin-left:auto;color:var(--C);font-weight:bold}

/* LOG */
.log{flex:1;background:#020502;border:1px solid var(--border);border-radius:3px;
  padding:5px 8px;overflow-y:auto;font-size:.76rem;
  display:flex;flex-direction:column-reverse;min-height:0}
.le{padding:2px 0;border-bottom:1px solid #0a120a;line-height:1.4}
.ts{color:var(--dim);font-size:.62rem}
.lnormal{color:var(--txt)} .levent{color:var(--Y)} .ldanger{color:var(--R)}
.lsuccess{color:var(--G)} .linfo{color:var(--B)} .lgrit{color:var(--O)}
.lsystem{color:var(--C);font-weight:bold;letter-spacing:2px} .ldim{color:var(--dim)}

/* ACTIONS */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex-shrink:0}
.ab{background:var(--panel);border:1px solid var(--border);border-radius:3px;
  padding:7px 8px;color:var(--txt);font-family:'Courier New',monospace;font-size:.7rem;
  cursor:pointer;text-align:left;touch-action:manipulation;position:relative;
  overflow:hidden;transition:transform .1s}
.ab:active:not(.off){transform:scale(.97)}
.ab.off{opacity:.25;cursor:not-allowed}
.ab-march{border-color:#1a3a1a} .ab-march:active:not(.off){background:#041004;border-color:var(--G)}
.ab-fast{border-color:#2a3a0a}  .ab-fast:active:not(.off){background:#0a1004;border-color:#88ff44}
.ab-sprint{border-color:#3a1a1a}.ab-sprint:active:not(.off){background:#100404;border-color:var(--R)}
.ab-rest{border-color:#1a2a3a}  .ab-rest:active:not(.off){background:#04080f;border-color:var(--B)}
.ab-drink{border-color:#0a2a3a} .ab-drink:active:not(.off){background:#020a10;border-color:var(--C)}
.ab-food{border-color:#2a2a0a}  .ab-food:active:not(.off){background:#0a0a04;border-color:var(--Y)}
.ab-grit{border-color:#2a1a0a}  .ab-grit:active:not(.off){background:#0f0804;border-color:var(--O)}
.ab-aid{border-color:#3a1a2a}   .ab-aid:active:not(.off){background:#100408;border-color:#ff44aa}
.ab-name{font-weight:bold;font-size:.72rem;letter-spacing:1px}
.ab-sub{color:var(--dim);font-size:.6rem;margin-top:2px}
.ab-key{position:absolute;top:4px;right:5px;font-size:.55rem;color:var(--dim);
  border:1px solid var(--border);padding:1px 3px;border-radius:1px}

/* MODALS */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.93);
  display:none;flex-direction:column;justify-content:center;align-items:center;
  z-index:200;padding:14px}
.modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--border);border-radius:5px;
  padding:18px;max-width:460px;width:100%;text-align:center}
.m-icon{font-size:2.2rem;margin-bottom:8px}
.m-title{font-size:1rem;font-weight:bold;letter-spacing:2px;margin-bottom:10px}
.m-desc{font-size:.8rem;color:var(--txt);line-height:1.65;margin-bottom:14px}
.m-choices{display:flex;flex-direction:column;gap:7px}
.end-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:12px 0;text-align:left}
.es{font-size:.72rem} .es-lbl{color:var(--dim)} .es-val{color:var(--Y);font-weight:bold}
.rank{font-size:3.5rem;font-weight:bold;margin:6px 0;text-shadow:0 0 20px currentColor}
.rank-name{font-size:.85rem;letter-spacing:4px;margin-bottom:6px}

/* BUTTONS */
.btn{background:var(--panel);color:var(--txt);border:1px solid var(--border);
  border-radius:3px;padding:10px 16px;font-family:'Courier New',monospace;
  font-size:.8rem;font-weight:bold;letter-spacing:1px;cursor:pointer;
  text-transform:uppercase;touch-action:manipulation;transition:transform .1s;width:100%}
.btn:active{transform:scale(.98)}
.bg{border-color:var(--G);color:var(--G)} .bg:active{background:#001a00}
.br{border-color:var(--R);color:var(--R)} .br:active{background:#1a0000}
.bb{border-color:var(--B);color:var(--B)} .bb:active{background:#00091a}
.by{border-color:var(--Y);color:var(--Y)} .by:active{background:#1a1400}
.bo{border-color:var(--O);color:var(--O)} .bo:active{background:#1a0800}
.bc{border-color:var(--C);color:var(--C)} .bc:active{background:#001a14}

/* FLASH */
#flash{position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:500;opacity:0;transition:opacity .08s}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>
<body>

<div id="flash"></div>

<!-- INTRO SCREEN -->
<div id="sc-intro" class="screen active">
  <div class="logo-box">
    <div class="logo-title">GIBUSH</div>
    <div class="logo-sub">IRON SELECTION · 50KM</div>
  </div>
  <div id="briefing" class="briefing"></div>
  <div id="diff-section" style="display:none;width:100%;max-width:380px">
    <div style="font-size:.65rem;color:var(--dim);letter-spacing:3px;text-align:center;margin-bottom:8px">SELECT DIFFICULTY</div>
    <div class="diff-grid">
      <button class="btn bg" onclick="startGame('recruit')">RECRUIT<br><span style="font-size:.6rem;font-weight:normal;color:var(--dim)">Forgiving</span></button>
      <button class="btn bb" onclick="startGame('operator')">OPERATOR<br><span style="font-size:.6rem;font-weight:normal;color:var(--dim)">Standard</span></button>
      <button class="btn by" onclick="startGame('iron')">IRON<br><span style="font-size:.6rem;font-weight:normal;color:var(--dim)">Brutal</span></button>
      <button class="btn br" onclick="startGame('legend')">LEGEND<br><span style="font-size:.6rem;font-weight:normal;color:var(--dim)">Unforgiving</span></button>
    </div>
    <div id="hs-label" class="hs-label" style="text-align:center;margin-top:8px"></div>
  </div>
</div>

<!-- MAIN GAME SCREEN -->
<div id="sc-game" class="screen">
  <div class="hud">
    <span id="hud-phase" class="hud-phase" style="color:var(--B)">PRE-DAWN MARCH</span>
    <span id="hud-time" class="hud-time">04:00</span>
    <span id="hud-wx" style="font-size:.68rem;color:var(--B)">CLEAR</span>
  </div>
  <div class="terrain">
    <div id="trn-sky" class="terrain-sky">*  .  * &#9790;  *  .</div>
    <div id="trn-gnd" class="terrain-ground"></div>
  </div>
  <div class="stats">
    <div class="stat" id="st-dist"><span class="sl">DIST</span><div class="sb"><div id="sf-dist" class="sf sf-dist" style="width:0%"></div></div><span id="sv-dist" class="sv" style="color:var(--G)">0/50km</span></div>
    <div class="stat" id="st-stam"><span class="sl">STAM</span><div class="sb"><div id="sf-stam" class="sf sf-stam" style="width:100%"></div></div><span id="sv-stam" class="sv">100</span></div>
    <div class="stat" id="st-hydr"><span class="sl">HYDR</span><div class="sb"><div id="sf-hydr" class="sf sf-hydr" style="width:100%"></div></div><span id="sv-hydr" class="sv">100</span></div>
    <div class="stat" id="st-grit"><span class="sl">GRIT</span><div class="sb"><div id="sf-grit" class="sf sf-grit" style="width:100%"></div></div><span id="sv-grit" class="sv">100</span></div>
    <div class="stat" id="st-nutr"><span class="sl">NUTR</span><div class="sb"><div id="sf-nutr" class="sf sf-nutr" style="width:100%"></div></div><span id="sv-nutr" class="sv">100</span></div>
    <div class="stat" id="st-temp"><span class="sl">TEMP</span><div class="sb"><div id="sf-temp" class="sf sf-temp" style="width:50%"></div></div><span id="sv-temp" class="sv">NORM</span></div>
  </div>
  <div id="effects" class="effects"></div>
  <div class="equip">
    <div class="eq"><span class="eq-lbl">CANTEEN</span><span id="eq-canteen" class="eq-val">3</span></div>
    <div class="eq"><span class="eq-lbl">RATION</span><span id="eq-ration" class="eq-val">2</span></div>
    <div class="eq"><span class="eq-lbl">TAPE</span><span id="eq-tape" class="eq-val">2</span></div>
    <div class="eq"><span class="eq-lbl">STIM</span><span id="eq-stim" class="eq-val">1</span></div>
    <div class="eq-score">SCR <span id="eq-score">0</span></div>
  </div>
  <div id="log" class="log">
    <div class="le"><span class="lsystem">SELECTION BEGINS. DO NOT QUIT.</span></div>
  </div>
  <div class="actions">
    <button class="ab ab-march" id="btn-march" onclick="act('march')"><div class="ab-name">RUCK MARCH</div><div class="ab-sub">+2km &middot; -stam -hydr</div><span class="ab-key">1</span></button>
    <button class="ab ab-fast"  id="btn-fast"  onclick="act('fast')"><div class="ab-name">FAST MARCH</div><div class="ab-sub">+3.5km &middot; heavy cost</div><span class="ab-key">2</span></button>
    <button class="ab ab-sprint" id="btn-sprint" onclick="act('sprint')"><div class="ab-name">STRETCHR SPRINT</div><div class="ab-sub">+5km &middot; extreme cost</div><span class="ab-key">3</span></button>
    <button class="ab ab-rest"  id="btn-rest"  onclick="act('rest')"><div class="ab-name">CATCH BREATH</div><div class="ab-sub">+stam &middot; -5 hydr</div><span class="ab-key">R</span></button>
    <button class="ab ab-drink" id="btn-drink" onclick="act('drink')"><div class="ab-name">DRINK CANTEEN</div><div class="ab-sub">+45 hydr &middot; uses canteen</div><span class="ab-key">W</span></button>
    <button class="ab ab-food"  id="btn-food"  onclick="act('food')"><div class="ab-name">EAT RATION</div><div class="ab-sub">+nutr +grit &middot; uses ration</div><span class="ab-key">F</span></button>
    <button class="ab ab-grit"  id="btn-focus" onclick="act('focus')"><div class="ab-name">MENTAL FOCUS</div><div class="ab-sub">+grit &middot; -stam</div><span class="ab-key">G</span></button>
    <button class="ab ab-aid"   id="btn-aid"   onclick="act('aid')"><div class="ab-name">FIRST AID</div><div class="ab-sub">clear injury &middot; uses tape</div><span class="ab-key">A</span></button>
  </div>
</div>

<!-- CHOICE MODAL -->
<div id="modal-choice" class="modal">
  <div class="mbox">
    <div id="ch-icon" class="m-icon">&#9889;</div>
    <div id="ch-title" class="m-title" style="color:var(--Y)">DECISION REQUIRED</div>
    <div id="ch-desc" class="m-desc"></div>
    <div id="ch-choices" class="m-choices"></div>
  </div>
</div>

<!-- CHECKPOINT MODAL -->
<div id="modal-cp" class="modal">
  <div class="mbox">
    <div id="cp-icon" class="m-icon">&#9873;</div>
    <div id="cp-title" class="m-title" style="color:var(--C)">CHECKPOINT</div>
    <div id="cp-desc" class="m-desc"></div>
    <div id="cp-reward" style="font-size:.78rem;color:var(--G);margin-bottom:14px"></div>
    <button class="btn bg" onclick="closeCP()">PRESS ON &#8594;</button>
  </div>
</div>

<!-- END MODAL -->
<div id="modal-end" class="modal">
  <div class="mbox">
    <div id="end-icon" class="m-icon">&#127894;</div>
    <div id="end-rank" class="rank" style="color:var(--G)">S</div>
    <div id="end-rank-name" class="rank-name" style="color:var(--dim)">IRON CANDIDATE</div>
    <div id="end-title" class="m-title"></div>
    <div id="end-desc" class="m-desc"></div>
    <div id="end-stats-grid" class="end-stats"></div>
    <button class="btn bg" onclick="restartGame()" style="margin-top:8px">RESTART SELECTION</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const DIFF = {
  recruit: {m:0.65, ec:0.15, cc:0.07, label:'RECRUIT'},
  operator:{m:1.00, ec:0.25, cc:0.12, label:'OPERATOR'},
  iron:    {m:1.35, ec:0.35, cc:0.16, label:'IRON'},
  legend:  {m:1.70, ec:0.45, cc:0.20, label:'LEGEND'},
};

const PHASES = [
  {id:'night1', name:'PRE-DAWN MARCH', km:[0,12],  color:'#40c4ff',
   sky:['*  .  * ☾  *  .','.*  ★  .  ★  *.','  ★  .  ★  ☾  '],
   terrain:'._.-._.-._-._.-._.-._.-._.-._.-._.-._.-._.-._.', hydrM:0.8, tempR:-0.4},
  {id:'dawn',   name:'DAWN PUSH',      km:[12,25], color:'#ff9800',
   sky:['░░▒▒▓▓▒░░','▒░▒▓▓▒░▒','░▒▓▓▓▒░'],
   terrain:'~^~^^~_^~^^_~~^~^^~_^~^^_~~^~^^~_^~^^_~~^~^^~', hydrM:1.1, tempR:0.5},
  {id:'heat',   name:'HEAT ORDEAL',    km:[25,38], color:'#ff5722',
   sky:['  ☀    ☀    ☀  ','    ☀    ☀    ',' ☀    ☀    ☀ '],
   terrain:'^^^/^^_^^/^^^^^/^^_^^/^^^^^/^^_^^/^^^^^/^^_^^/', hydrM:1.5, tempR:1.0},
  {id:'dusk',   name:'DUSK MARCH',     km:[38,45], color:'#e91e63',
   sky:['██▇▆▅▄▃▂▁','▇▆▅▄▃▂▁▂▃','▁▂▃▄▅▆▇█▇'],
   terrain:'_~_^^_~_^^_~_^^_~_^^_~_^^_~_^^_~_^^_~_^^_~_^^', hydrM:1.0, tempR:0.2},
  {id:'night2', name:'FINAL PUSH',     km:[45,50], color:'#b39ddb',
   sky:['★ ☾ ★  .  ☆ ★','. ★  ★  ☾  ★  .','★  ☆  ★  ☾ ★  ★'],
   terrain:'._.-._-.._.--._.-._-.._.--._.-._-.._.--._.-._', hydrM:0.9, tempR:-0.3},
];

const CPS = [
  {km:12, title:'ALPHA CHECKPOINT', icon:'⛳',
   desc:'First checkpoint. Medic checks your feet. Gear inspected. Canteens refilled.',
   reward:'Canteens +2  ·  Grit +10',
   fn(g){g.canteens=Math.min(3,g.canteens+2);g.grit=clamp(g.grit+10,0,100)}},
  {km:25, title:'BRAVO CHECKPOINT', icon:'⚑',
   desc:'Halfway mark. Rations distributed. A 5-minute water halt is called.',
   reward:'Rations +1  ·  Hydration +25',
   fn(g){g.rations=Math.min(3,g.rations+1);g.hydr=clamp(g.hydr+25,0,100)}},
  {km:38, title:'CHARLIE CHECKPOINT', icon:'❤',
   desc:'Final checkpoint before the home stretch. Medical officer clears you.',
   reward:'Canteens +2  ·  Worst status cleared',
   fn(g){g.canteens=Math.min(3,g.canteens+2);clearWorstFx(g)}},
  {km:45, title:'FIVE KILOMETERS', icon:'⚡',
   desc:'Five kilometers remain. You can hear the finish. This is what it\'s all for.',
   reward:'Grit +30  ·  Stamina +15',
   fn(g){g.grit=clamp(g.grit+30,0,100);g.stam=clamp(g.stam+15,0,100)}},
];

const WEATHER = ['CLEAR','HEADWIND','SANDSTORM','HEATWAVE','COLD SNAP','FOG'];
const WX_FX = {
  CLEAR:     {color:'var(--B)',  stamM:1.0, hydrM:1.0},
  HEADWIND:  {color:'var(--C)',  stamM:1.3, hydrM:1.1},
  SANDSTORM: {color:'var(--Y)',  stamM:1.2, hydrM:1.3},
  HEATWAVE:  {color:'var(--R)',  stamM:1.1, hydrM:1.6},
  'COLD SNAP':{color:'var(--B)',  stamM:1.2, hydrM:0.8},
  FOG:       {color:'var(--dim)', stamM:1.1, hydrM:1.0},
};

// EVENTS (no choice)
const EVTS = [
  // terrain
  {c:'terrain',m:"Deep sand. Every step sinks past the ankle. Your calves are ruined.",stam:-10,hydr:-5},
  {c:'terrain',m:"Rocky scree. Impossible to find footing. You fight for every step.",stam:-8,hydr:-3},
  {c:'terrain',m:"Steep incline. Your quads are screaming at you. You ignore them.",stam:-12,hydr:-4},
  {c:'terrain',m:"Loose gravel descent. Nearly down twice. Heart rate spikes.",stam:-6,grit:-5},
  {c:'terrain',m:"Wadi crossing. The terrain drops then rises brutally.",stam:-10,hydr:-4},
  {c:'terrain',m:"Thorn scrub forces a detour. Time and energy lost.",stam:-7,hydr:-3},
  {c:'terrain',m:"Muddy river crossing. Cold water floods your boots.",stam:-8,hydr:-3,nutr:-3},
  {c:'terrain',m:"You stumble on a root in the darkness. Adrenaline spikes.",stam:-5,grit:-5},
  // weather
  {c:'weather',m:"Headwind hits like a wall. Every step is twice the effort.",stam:-10,hydr:-4},
  {c:'weather',m:"Temperature spikes. The desert floor radiates heat upward.",hydr:-12,temp:15},
  {c:'weather',m:"Sand in the wind. Eyes burn. You push through blind.",stam:-6,hydr:-4,grit:-5},
  {c:'weather',m:"Rain soaks everything. Gear adds weight. You adapt.",stam:-8,hydr:5},

// STATE

let G = {};

function newState(diff) {
  G = {
    dist:0, stam:100, hydr:100, grit:100, nutr:100, temp:50,
    canteens:3, rations:2, tape:2, stimUsed:false,
    fx: {},       // id -> {name,type,turns}
    injuries: {blisters:false,cramps:false,heatex:false,hypo:false},
    hour:4, min:0,
    actions:0, marches:0, injCount:0, evCount:0,
    cpIdx:0,
    over:false,
    diff:diff,
    wx:WEATHER[0],
    wxTimer:0,
    score:0,
  };
}

// ─────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function clampState() {
  ['stam','hydr','grit','nutr'].forEach(k=>{ G[k]=clamp(G[k],0,100); });
  G.temp = clamp(G.temp, 0, 100);
  G.dist = clamp(G.dist, 0, 50);
}

function currentPhase() {
  for(let p of PHASES) if(G.dist >= p.km[0] && G.dist < p.km[1]) return p;
  return PHASES[PHASES.length-1];
}

function timeStr() {
  return String(G.hour).padStart(2,'0')+':'+String(G.min).padStart(2,'0');
}

function advTime(mins) {
  G.min += mins;
  while(G.min >= 60){ G.min -= 60; G.hour = (G.hour+1)%24; }
}

function diffMult() { return DIFF[G.diff].m; }

// ─────────────────────────────────────────────
// LOG
// ─────────────────────────────────────────────
const logEl = () => document.getElementById('log');

function log(msg, cls='lnormal') {
  const el = logEl();
  const div = document.createElement('div');
  div.className = 'le';
  div.innerHTML = `<span class="ts">[${timeStr()}]</span> <span class="${cls}">${msg}</span>`;
  el.prepend(div);
  while(el.children.length > 30) el.removeChild(el.lastChild);
}

// ─────────────────────────────────────────────
function addFx(id, type, turns) {
  G.fx[id] = {type, turns};
}
function hasFx(id) { return !!G.fx[id]; }
function tickFx() {
  for(let id in G.fx) {
    G.fx[id].turns--;
    if(G.fx[id].turns <= 0) delete G.fx[id];
  }
}
function clearWorstFx(g) {
  if(g.injuries.heatex) { g.injuries.heatex=false; return; }
  if(g.injuries.cramps) { g.injuries.cramps=false; return; }
  if(g.injuries.blisters){ g.injuries.blisters=false; return; }
}

function renderFx() {
  const el = document.getElementById('effects');
  el.innerHTML = '';
  // injuries
  const injLabels = {blisters:'BLISTERS',cramps:'CRAMPS',heatex:'HEAT-EX',hypo:'HYPO'};
  for(let k in G.injuries) {
    if(G.injuries[k]) {
      const s = document.createElement('span');
      s.className='eff eff-bad'; s.textContent=injLabels[k];
      el.appendChild(s);
    }
  }
  // buffs
  const fxLabels = {BOND:'BOND',LEGEND:'LEGEND',HERO:'HERO',STIM:'STIM',
                    WIND:'WIND',MOTIVATED:'MOTIVATED'};
  for(let id in G.fx) {
    const s = document.createElement('span');
    s.className='eff eff-'+G.fx[id].type;
    s.textContent=(fxLabels[id]||id)+'('+G.fx[id].turns+')';
    el.appendChild(s);
  }
}

// ─────────────────────────────────────────────
// AUDIO
// ─────────────────────────────────────────────
let AC = null;
function initAudio() {
  try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
}
function beep(freq=440, dur=0.08, vol=0.15, type='square') {
  if(!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.start(); o.stop(AC.currentTime+dur);
  } catch(e){}
}
function sfx(type) {
  switch(type) {
    case 'march':  beep(200,0.06,0.1,'sawtooth'); break;
    case 'fast':   beep(250,0.06,0.12,'sawtooth'); break;
    case 'sprint': beep(180,0.12,0.15,'sawtooth'); break;
    case 'drink':  beep(880,0.15,0.1,'sine'); break;
    case 'food':   beep(660,0.12,0.1,'sine'); break;
    case 'rest':   beep(330,0.18,0.08,'sine'); break;
    case 'focus':  beep(440,0.12,0.1,'triangle'); break;
    case 'aid':    beep(550,0.15,0.1,'sine'); break;
    case 'event':  beep(300,0.08,0.1,'square'); break;
    case 'cp':     [440,550,660].forEach((f,i)=>setTimeout(()=>beep(f,.15,.18,'sine'),i*120)); break;
    case 'win':    [440,550,660,880].forEach((f,i)=>setTimeout(()=>beep(f,.25,.2,'sine'),i*200)); break;
    case 'lose':   [300,200,150].forEach((f,i)=>setTimeout(()=>beep(f,.3,.2,'sawtooth'),i*250)); break;
    case 'choice': beep(400,0.06,0.12,'square'); setTimeout(()=>beep(500,0.06,0.12,'square'),120); break;
    case 'alert':  beep(700,0.05,0.15,'square'); setTimeout(()=>beep(700,0.05,0.15,'square'),150); break;
  }
}

// ─────────────────────────────────────────────
// TERRAIN STRIP
// ─────────────────────────────────────────────
function renderTerrain() {
  const phase = currentPhase();
  const skyIdx = Math.floor(G.actions/5) % 3;
  document.getElementById('trn-sky').textContent = phase.sky[skyIdx];

  const terrain = phase.terrain;
  const span = phase.km[1] - phase.km[0];
  const pos = G.dist - phase.km[0];
  const pct = span > 0 ? pos/span : 1;
  const ci = Math.floor(pct * (terrain.length-1));

  const W=26, PP=9;
  let html='';
  for(let i=0;i<W;i++){
    if(i===PP){
      html+='<span style="color:var(--Y);font-weight:bold">△</span>';
    } else {
      const ti = ci - PP + i;
      const si = ((ti % terrain.length) + terrain.length) % terrain.length;
      const ch = terrain[si] || '.';
      if(i < PP) html+=`<span style="color:var(--dim)">${ch}</span>`;
      else html+=`<span style="color:var(--G)">${ch}</span>`;
    }
  }
  // dist indicator
  const pBar = Math.floor((G.dist/50)*12);
  html += `  <span style="color:var(--dim);font-size:.65rem">[${'█'.repeat(pBar)}${'·'.repeat(12-pBar)}]${G.dist}km</span>`;
  document.getElementById('trn-gnd').innerHTML = html;
}

function renderStats() {

    const pct = clamp(val/max*100,0,100);
    document.getElementById('sf-'+id).style.width = pct+'%';
    document.getElementById('sv-'+id).textContent = sfx || Math.round(val);
    const row = document.getElementById('st-'+id);
    row.classList.remove('crit','warn');
    if(pct<=20) row.classList.add('crit');
    else if(pct<=40) row.classList.add('warn');
  };
  set('dist', G.dist, 50, 'DIST', G.dist+'/50km');
  set('stam', G.stam, 100);
  set('hydr', G.hydr, 100);
  set('grit', G.grit, 100);
  set('nutr', G.nutr, 100);
  // temp display
  const tempPct = G.temp;
  document.getElementById('sf-temp').style.width = tempPct+'%';
  let tLabel='NORM', tColor='var(--G)';
  if(tempPct<=20){tLabel='COLD';tColor='var(--B)'}
  else if(tempPct<=35){tLabel='COOL';tColor='var(--C)'}
  else if(tempPct<=65){tLabel='NORM';tColor='var(--G)'}
  else if(tempPct<=80){tLabel='WARM';tColor='var(--Y)'}
  else if(tempPct<=90){tLabel='HOT!';tColor='var(--O)'}

  document.getElementById('sv-temp').style.color = tColor;
  const stTemp = document.getElementById('st-temp');
  stTemp.classList.remove('crit','warn');
  if(tempPct>=90||tempPct<=10) stTemp.classList.add('crit');
  else if(tempPct>=75||tempPct<=20) stTemp.classList.add('warn');

// ─────────────────────────────────────────────
// PASSIVE EFFECTS (applied after each action)
// ─────────────────────────────────────────────
function applyPassive() {
  const phase = currentPhase();
  const wx = WX_FX[G.wx] || WX_FX.CLEAR;

  // temp drift toward phase baseline
  G.temp = clamp(G.temp + phase.tempR*10, 0, 100);
  // weather temp override
  if(G.wx==='HEATWAVE') G.temp=clamp(G.temp+5,0,100);
  if(G.wx==='COLD SNAP') G.temp=clamp(G.temp-5,0,100);

  // injury effects
  if(G.injuries.heatex){ G.hydr=clamp(G.hydr-5,0,100); }
  if(G.injuries.hypo){ G.stam=clamp(G.stam-5,0,100); }
  if(G.injuries.cramps){ G.stam=clamp(G.stam-2,0,100); }

  // apply/clear injuries from stat thresholds
  if(G.temp>=88 && !G.injuries.heatex){ G.injuries.heatex=true; log("HEAT EXHAUSTION. Immediate danger.",'ldanger'); sfx('alert'); flash('rgba(255,0,0,.25)',.3); G.injCount++; }
  if(G.temp<88 && G.temp>=70 && G.injuries.heatex){ /* still hot */ }
  if(G.temp<70 && G.injuries.heatex){ G.injuries.heatex=false; log("Heat exhaustion cleared. Temp normalizing.",'lsuccess'); }
  if(G.temp<=12 && !G.injuries.hypo){ G.injuries.hypo=true; log("HYPOTHERMIA setting in.",'ldanger'); sfx('alert'); G.injCount++; }
  if(G.temp>20 && G.injuries.hypo){ G.injuries.hypo=false; log("Hypothermia cleared.",'lsuccess'); }
  if(G.hydr<=20 && !G.injuries.cramps){ G.injuries.cramps=true; log("CRAMPS from dehydration.",'ldanger'); G.injCount++; }
  if(G.hydr>40 && G.injuries.cramps){ G.injuries.cramps=false; log("Cramps easing.",'lsuccess'); }
  if(G.marches>=8 && !G.injuries.blisters){ G.injuries.blisters=true; log("BLISTERS developing. Every step costs.",'ldanger'); G.injCount++; }

  // blisters cost extra on march
  // (handled inside act)

  // weather change (random, every ~8 actions)
  G.wxTimer++;
  if(G.wxTimer >= rnd(6,10)) {
    G.wxTimer = 0;
    const possibleWx = phase.id==='heat' ? ['CLEAR','HEADWIND','SANDSTORM','HEATWAVE','HEATWAVE'] :
                       phase.id.includes('night') ? ['CLEAR','COLD SNAP','FOG','CLEAR','CLEAR'] :
                       WEATHER;
    const newWx = pick(possibleWx);
    if(newWx !== G.wx) {
      G.wx = newWx;
      const wxColor = WX_FX[newWx]?.color || 'var(--B)';
      log(`Weather shift: ${newWx}.`, 'linfo');
    }
  }

  // score tick
  G.score = calcScore();
}

// ─────────────────────────────────────────────
// EVENT SYSTEM
// ─────────────────────────────────────────────
function maybeEvent(isMove) {
  const d = DIFF[G.diff];
  if(!isMove) return;

  // Choice event?
  if(Math.random() < d.cc && CHOICES.length > 0) {
    const choice = pick(CHOICES);
    showChoiceModal(choice);
    return;
  }

  // Regular event?
  if(Math.random() < d.ec) {
    const evt = pick(EVTS);
    G.evCount++;
    sfx('event');
    let cls = 'levent';
    if(evt.c==='good') cls='lsuccess';
    if(evt.c==='terrain'||evt.c==='medical') cls='ldanger';
    if(evt.c==='mental') cls='lgrit';
    log('■ EVENT: '+evt.m, cls);
    if(evt.stam) G.stam = clamp(G.stam + evt.stam * (evt.stam<0?diffMult():1), 0, 100);
    if(evt.hydr) G.hydr = clamp(G.hydr + evt.hydr * (evt.hydr<0?diffMult():1), 0, 100);
    if(evt.grit) G.grit = clamp(G.grit + evt.grit * (evt.grit<0?diffMult():1), 0, 100);
    if(evt.nutr) G.nutr = clamp(G.nutr + evt.nutr, 0, 100);
    if(evt.temp) G.temp = clamp(G.temp + evt.temp, 0, 100);
    if(evt.stam < -8) flash('rgba(255,42,42,.2)');
  }
}

// ─────────────────────────────────────────────
// CHECKPOINTS
// ─────────────────────────────────────────────
function checkCP() {
  for(let i=G.cpIdx; i<CPS.length; i++) {
    const cp = CPS[i];
    if(G.dist >= cp.km) {
      G.cpIdx = i+1;
      cp.fn(G);
      sfx('cp');
      flash('rgba(0,255,204,.15)');
      document.getElementById('cp-icon').textContent = cp.icon;
      document.getElementById('cp-title').textContent = cp.title;
      document.getElementById('cp-desc').textContent = cp.desc;
      document.getElementById('cp-reward').textContent = cp.reward;
      document.getElementById('modal-cp').classList.add('show');
      return true;
    }
  }
  return false;
}
function closeCP() {
  document.getElementById('modal-cp').classList.remove('show');
  log('⚑ CHECKPOINT CLEARED. PRESS ON.','lsystem');
  render();
}

// ─────────────────────────────────────────────
// CHOICE MODAL
// ─────────────────────────────────────────────
function showChoiceModal(ev) {
  sfx('choice');
  flash('rgba(255,230,0,.15)');
  document.getElementById('ch-icon').textContent = ev.icon;
  document.getElementById('ch-title').textContent = ev.title;
  document.getElementById('ch-desc').textContent = ev.desc;
  const cc = document.getElementById('ch-choices');
  cc.innerHTML = '';
  ev.opts.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'btn '+(opt.cls||'bg');
    b.textContent = opt.t;
    b.onclick = () => {
      document.getElementById('modal-choice').classList.remove('show');
      opt.fn(G);
      G.choicesMade = (G.choicesMade||0)+1;
      clampState();
      checkWinLoss();
      render();
    };
    cc.appendChild(b);
  });
  document.getElementById('modal-choice').classList.add('show');
}

// ─────────────────────────────────────────────
// WIN / LOSS
// ─────────────────────────────────────────────
function checkWinLoss() {
  if(G.over) return;
  if(G.dist >= 50) { endGame(true,'finish'); return; }
  if(G.hydr <= 0) { endGame(false,'dehydration',"You collapsed from severe dehydration. Medical evacuation."); return; }
  if(G.stam <= 0 && G.grit <= 0) { endGame(false,'exhaustion',"Your body and mind gave out simultaneously. You rang the bell."); return; }
  if(G.nutr <= 0 && G.stam <= 5) { endGame(false,'starvation',"Fuel depleted. You have nothing left to run on."); return; }
}

// ─────────────────────────────────────────────
// SCORE
// ─────────────────────────────────────────────
function calcScore() {
  const distScore = G.dist * 100;
  const statBonus = Math.floor((G.stam + G.hydr + G.grit + G.nutr) / 4) * 5;
  const injPenalty = G.injCount * 200;
  const diffBonus = {recruit:1, operator:1.5, iron:2.2, legend:3.5}[G.diff] || 1;
  return Math.max(0, Math.floor((distScore + statBonus - injPenalty) * diffBonus));
}

function getRank(score) {
  if(score >= 8000) return {rank:'S',name:'IRON ELITE',    color:'var(--G)' };
  if(score >= 5000) return {rank:'A',name:'OPERATOR',      color:'var(--B)' };
  if(score >= 3000) return {rank:'B',name:'CANDIDATE',     color:'var(--Y)' };
  if(score >= 1500) return {rank:'C',name:'VOLUNTEER',     color:'var(--O)' };
  return                    {rank:'D',name:'DID NOT PASS', color:'var(--R)' };
}

// ─────────────────────────────────────────────
// END GAME
// ─────────────────────────────────────────────
function endGame(win, reason, desc='') {
  if(G.over) return;
  G.over = true;
  G.score = calcScore();

  sfx(win?'win':'lose');
  flash(win?'rgba(0,255,65,.3)':'rgba(255,42,42,.4)', .4);

  const rank = getRank(win?G.score:Math.floor(G.score*0.3));
  saveHS(G.diff, win?G.score:0);

  const icon = win ? '🎖' : '⚠️';
  const title = win ? 'SELECTION COMPLETE' : 'WASHED OUT';
  const descFinal = win ? 'You completed 50km and earned your place.' : desc;

  document.getElementById('end-icon').textContent = icon;
  document.getElementById('end-rank').textContent = rank.rank;
  document.getElementById('end-rank').style.color = rank.color;
  document.getElementById('end-rank-name').textContent = rank.name;
  document.getElementById('end-title').textContent = title;
  document.getElementById('end-title').style.color = win?'var(--G)':'var(--R)';
  document.getElementById('end-desc').textContent = descFinal;

  const statsGrid = document.getElementById('end-stats-grid');
  const items = [
    ['DISTANCE',  G.dist+' / 50 km'],
    ['SCORE',     G.score.toLocaleString()],
    ['DIFFICULTY',DIFF[G.diff].label],
    ['TIME',      timeStr()],
    ['ACTIONS',   G.actions],
    ['EVENTS HIT',G.evCount],
    ['INJURIES',  G.injCount],
    ['STAMINA',   Math.round(G.stam)+'%'],
    ['HYDRATION', Math.round(G.hydr)+'%'],
    ['GRIT',      Math.round(G.grit)+'%'],
  ];
  statsGrid.innerHTML = items.map(([l,v])=>
    `<div class="es"><span class="es-lbl">${l}: </span><span class="es-val">${v}</span></div>`
  ).join('');

  document.getElementById('modal-end').classList.add('show');
}

// ─────────────────────────────────────────────
// HIGH SCORES
// ─────────────────────────────────────────────
function saveHS(diff, score) {
  try {
    const key = 'gibush_hs_'+diff;
    const prev = parseInt(localStorage.getItem(key)||'0');
    if(score > prev) localStorage.setItem(key, score);
  } catch(e){}
}
function getHS(diff) {
  try { return parseInt(localStorage.getItem('gibush_hs_'+diff)||'0'); } catch(e){ return 0; }
}

// ─────────────────────────────────────────────
// MAIN ACTION HANDLER
// ─────────────────────────────────────────────
function act(type) {
  if(G.over) return;
  if(document.getElementById('modal-choice').classList.contains('show')) return;
  if(document.getElementById('modal-cp').classList.contains('show')) return;
  if(!AC) initAudio();

  const d = diffMult();
  const phase = currentPhase();
  const wx = WX_FX[G.wx] || WX_FX.CLEAR;
  let moved = false;

  switch(type) {
    case 'march': {
      sfx('march');
      let sCost = Math.round(12 * d * wx.stamM);
      let hCost = Math.round(8 * d * wx.hydrM * phase.hydrM);
      let nCost = 3;
      if(G.injuries.blisters) sCost += 4;
      if(G.injuries.cramps) sCost += 3;
      if(G.stam <= 0) {
        G.grit = clamp(G.grit - Math.round(12*d), 0, 100);
        log("Pushing on empty. Running on pure grit.", 'lgrit');
        flash('rgba(255,140,0,.15)');
      } else {
        G.stam = clamp(G.stam - sCost, 0, 100);
      }
      G.hydr = clamp(G.hydr - hCost, 0, 100);
      G.nutr = clamp(G.nutr - nCost, 0, 100);
      G.temp = clamp(G.temp + 3, 0, 100);
      G.dist = clamp(G.dist + 2, 0, 50);
      G.marches++;
      advTime(18);
      log(`Rucked 2km. [${G.dist}/50km]`, 'lnormal');
      moved = true;
      break;
    }
    case 'fast': {
      sfx('fast');
      let sCost = Math.round(20 * d * wx.stamM);
      let hCost = Math.round(13 * d * wx.hydrM * phase.hydrM);
      if(G.injuries.blisters) sCost += 6;
      if(G.stam <= 0) {
        G.grit = clamp(G.grit - Math.round(18*d), 0, 100);
        log("Fast march on fumes. Grit paying the cost.", 'lgrit');
      } else {
        G.stam = clamp(G.stam - sCost, 0, 100);
      }
      G.hydr = clamp(G.hydr - hCost, 0, 100);
      G.nutr = clamp(G.nutr - 5, 0, 100);
      G.temp = clamp(G.temp + 6, 0, 100);
      G.dist = clamp(G.dist + 3.5, 0, 50);
      G.marches++;
      advTime(22);
      log(`Fast march 3.5km. [${Math.round(G.dist)}/50km]`, 'lnormal');
      moved = true;
      flash('rgba(0,255,65,.07)');
      break;
    }
    case 'sprint': {
      if(G.stam < 10 && G.grit < 20) {
        log("You don't have the strength to sprint.", 'ldanger');
        sfx('alert');
        return;
      }
      sfx('sprint');
      let sCost = Math.round(35 * d * wx.stamM);
      let hCost = Math.round(20 * d * wx.hydrM * phase.hydrM);
      if(G.injuries.blisters) sCost += 8;
      if(G.stam <= sCost * 0.6) {
        G.grit = clamp(G.grit - Math.round(25*d), 0, 100);
        G.stam = clamp(G.stam - Math.round(sCost*0.5), 0, 100);
        log("Stretcher sprint on grit reserves. Jaw clenched.", 'lgrit');
      } else {
        G.stam = clamp(G.stam - sCost, 0, 100);
      }
      G.hydr = clamp(G.hydr - hCost, 0, 100);
      G.nutr = clamp(G.nutr - 8, 0, 100);
      G.temp = clamp(G.temp + 12, 0, 100);
      G.dist = clamp(G.dist + 5, 0, 50);
      G.marches++;
      advTime(28);
      log(`⚡ STRETCHER SPRINT! 5km cleared. [${Math.round(G.dist)}/50km]`, 'lgrit');
      moved = true;
      flash('rgba(255,230,0,.1)');
      break;
    }
    case 'rest': {
      sfx('rest');
      let sGain = hasFx('BOND')||hasFx('MOTIVATED') ? 35 : 28;
      if(G.injuries.cramps) sGain = Math.floor(sGain*0.5);
      G.stam = clamp(G.stam + sGain, 0, 100);
      G.hydr = clamp(G.hydr - 5, 0, 100);
      G.grit = clamp(G.grit - 3, 0, 100);
      G.temp = clamp(G.temp - 5, 0, 100);
      advTime(12);
      log("Caught breath. Stamina recovered.", 'linfo');
      break;
    }
    case 'drink': {
      if(G.canteens <= 0) { log("No canteens remaining.", 'ldanger'); return; }
      if(G.hydr >= 100) { log("Fully hydrated already.", 'ldim'); return; }
      sfx('drink');
      G.canteens--;
      G.hydr = clamp(G.hydr + 45, 0, 100);
      G.temp = clamp(G.temp - 5, 0, 100);
      advTime(3);
      log(`Drank from canteen. Hydration up. (${G.canteens} remaining)`, 'linfo');
      flash('rgba(0,170,255,.1)');
      break;
    }
    case 'food': {
      if(G.rations <= 0) { log("No rations remaining.", 'ldanger'); return; }
      if(G.nutr >= 100) { log("Already at full nutrition.", 'ldim'); return; }
      sfx('food');
      G.rations--;
      G.nutr = clamp(G.nutr + 55, 0, 100);
      G.grit = clamp(G.grit + 5, 0, 100);
      advTime(5);
      log(`Ate ration. Nutrition and morale up. (${G.rations} remaining)`, 'lsuccess');
      break;
    }
    case 'focus': {
      sfx('focus');
      const gGain = hasFx('RAGE')||hasFx('HERO') ? 32 : 25;
      G.grit = clamp(G.grit + gGain, 0, 100);
      G.stam = clamp(G.stam - 8, 0, 100);
      advTime(10);
      log("Mental focus. Grit restored. Mind over matter.", 'lgrit');
      flash('rgba(255,140,0,.1)');
      break;
    }
    case 'aid': {
      const hasBad = Object.values(G.injuries).some(v=>v);
      if(G.tape <= 0) { log("No medical tape remaining.", 'ldanger'); return; }
      if(!hasBad) { log("No active injuries to treat.", 'ldim'); return; }
      sfx('aid');
      G.tape--;
      if(G.injuries.blisters){ G.injuries.blisters=false; G.marches=0; log(`Medical tape applied. Blisters treated. (${G.tape} remaining)`, 'lsuccess'); }
      else if(G.injuries.cramps){ G.injuries.cramps=false; log(`Cramps treated. (${G.tape} remaining)`, 'lsuccess'); }
      else if(G.injuries.heatex){ G.injuries.heatex=false; log(`Heat exhaustion treated. (${G.tape} remaining)`, 'lsuccess'); }
      advTime(5);
      flash('rgba(0,255,65,.1)');
      break;
    }
    default: return;
  }

  G.actions++;
  clampState();
  applyPassive();
  tickFx();

  if(type==='march'||type==='fast'||type==='sprint') {
    maybeEvent(true);
  }

  if(!G.over && !checkCP()) {
    checkWinLoss();
  }
  render();
}

// ─────────────────────────────────────────────
// KEYBOARD
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if(G.over) return;
  const map = {'1':'march','2':'fast','3':'sprint','r':'rest','w':'drink',
               'f':'food','g':'focus','a':'aid'};
  const k = e.key.toLowerCase();
  if(map[k]) act(map[k]);
});

// ─────────────────────────────────────────────
// INTRO TYPEWRITER
// ─────────────────────────────────────────────
const BRIEF_TEXT = [
  "CANDIDATE.",
  "",
  "You have 50 kilometers ahead of you.",
  "No shortcuts. No one is coming to help.",
  "You will manage your stamina, hydration,",
  "nutrition, body temperature, and the one",
  "thing no one can take from you — your grit.",
  "",
  "Instructors will push you. Events will break you.",
  "Equipment will fail. Your mind will lie.",
  "",
  "The only way out is forward.",
  "",
  "Select your difficulty.",
];

let briefLine=0, briefChar=0, briefDone=false;
let briefInterval=null;

function runBriefing() {
  const el = document.getElementById('briefing');
  briefInterval = setInterval(()=>{
    if(briefLine >= BRIEF_TEXT.length) {
      clearInterval(briefInterval);
      briefDone=true;
      document.getElementById('diff-section').style.display='block';
      const hs = ['recruit','operator','iron','legend'].map(d=>{
        const s=getHS(d); return s>0?`${DIFF[d].label}:${s.toLocaleString()}`:'';
      }).filter(Boolean).join('  ');
      if(hs) document.getElementById('hs-label').textContent='BEST: '+hs;
      return;
    }
    const line = BRIEF_TEXT[briefLine];
    if(briefChar < line.length){
      el.innerHTML = el.innerHTML.replace('<span class="cursor"></span>','')+line[briefChar]+'<span class="cursor"></span>';
      briefChar++;
    } else {
      el.innerHTML = el.innerHTML.replace('<span class="cursor"></span>','')+'\n<span class="cursor"></span>';
      briefLine++; briefChar=0;
    }
  }, 28);
}

// click to skip briefing
document.getElementById('sc-intro').addEventListener('click', ()=>{
  if(!briefDone){
    clearInterval(briefInterval);
    briefDone=true;
    document.getElementById('briefing').innerHTML = BRIEF_TEXT.join('\n');
    document.getElementById('diff-section').style.display='block';
    const hs = ['recruit','operator','iron','legend'].map(d=>{
      const s=getHS(d); return s>0?`${DIFF[d].label}:${s.toLocaleString()}`:'';
    }).filter(Boolean).join('  ');
    if(hs) document.getElementById('hs-label').textContent='BEST: '+hs;
  }
});

// ─────────────────────────────────────────────
// GAME START / RESTART
// ─────────────────────────────────────────────
function startGame(diff) {
  if(!AC) initAudio();
  newState(diff);
  document.getElementById('sc-intro').classList.remove('active');
  document.getElementById('sc-game').classList.add('active');
  document.getElementById('log').innerHTML =
    `<div class="le"><span class="lsystem">[ ${DIFF[diff].label} MODE ] SELECTION BEGINS. DO NOT QUIT.</span></div>`;
  log(`04:00 · Target: 50km · Weather: CLEAR · ${DIFF[diff].label} mode active.`, 'linfo');
  render();
  beep(220,.2,.15,'sine');
  setTimeout(()=>beep(330,.2,.15,'sine'),200);
  setTimeout(()=>beep(440,.3,.15,'sine'),400);
}

function restartGame() {
  document.getElementById('modal-end').classList.remove('show');
  document.getElementById('sc-game').classList.remove('active');
  document.getElementById('sc-intro').classList.add('active');
  briefLine=0; briefChar=0; briefDone=false;
  document.getElementById('briefing').innerHTML='<span class="cursor"></span>';
  document.getElementById('diff-section').style.display='none';
  setTimeout(runBriefing, 300);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
runBriefing();
</script>
