<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tactical Strike: Mobile Arena</title>
<style>
:root{--bg:#0b0c10;--panel:#1a1e26;--gold:#c5a059;--red:#ff3333;--orange:#ff6600;--green:#33cc55}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none}
body{font-family:'Arial Black',sans-serif;background:var(--bg);color:#fff;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#hud-top{display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;background:var(--panel);border-bottom:2px solid var(--gold);
  font-size:.75rem;letter-spacing:1px;flex-shrink:0;height:40px}
.hud-g{color:var(--gold);font-weight:bold}
#wave-txt{letter-spacing:3px}
#streak-alert{color:var(--orange);font-size:.65rem;letter-spacing:1px;
  animation:pu 1s infinite;display:none}
@keyframes pu{50%{opacity:.3}}
#game-area{flex:1;position:relative;overflow:hidden;min-height:0}
canvas{width:100%;height:100%;display:block}
#hud-bot{background:var(--panel);border-top:2px solid var(--gold);
  padding:7px 10px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.hr{display:flex;align-items:center;gap:7px}
#hp-bg{flex:1;height:13px;background:#111;border:1px solid #444;border-radius:2px;overflow:hidden}
#hp-fill{height:100%;background:linear-gradient(90deg,#22aa44,#33cc55);transition:width .2s,background .3s}
#hp-txt{font-size:.7rem;color:var(--red);width:40px;text-align:right;flex-shrink:0}
.wpn-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.wb{background:#0d0f14;color:#888;border:1px solid #333;padding:5px 2px;
  font-size:.52rem;border-radius:3px;cursor:pointer;letter-spacing:.5px;
  font-family:inherit;line-height:1.3;text-align:center}
.wb.on{border-color:var(--gold);background:#1a1500;color:var(--gold)}
.wb.lk{opacity:.3;cursor:not-allowed}
#reload-btn{background:var(--orange);color:#fff;border:none;padding:7px 10px;
  font-size:.72rem;border-radius:3px;cursor:pointer;font-family:inherit;letter-spacing:1px;flex-shrink:0}
#nade-btn{background:#101a10;color:var(--green);border:1px solid var(--green);
  padding:7px 10px;font-size:.7rem;border-radius:3px;cursor:pointer;font-family:inherit;flex-shrink:0}
#ammo-d{font-size:.82rem;color:var(--gold);margin-left:auto;letter-spacing:1px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(11,12,16,.96);display:flex;
  flex-direction:column;justify-content:center;align-items:center;
  z-index:100;padding:20px;text-align:center;gap:12px}
.overlay h1{color:var(--gold);font-size:1.8rem;letter-spacing:3px}
.overlay p{color:#888;font-size:.88rem}
.mb{display:flex;flex-direction:column;gap:9px;width:100%;max-width:280px}
.mb button{background:#111;color:#ddd;border:1px solid #333;padding:13px;
  font-family:inherit;font-size:.82rem;border-radius:4px;cursor:pointer;letter-spacing:1px}
.ob{background:var(--orange);color:#fff;border:none;padding:13px 28px;
  font-family:inherit;font-size:.88rem;border-radius:4px;cursor:pointer;
  letter-spacing:2px;width:100%;max-width:280px;margin-top:4px}
#wc-ov,#go-ov{display:none}
#wc-ov h1{color:var(--green)}
#go-ov h1{color:var(--red)}
#spop{position:fixed;top:46px;left:50%;transform:translateX(-50%);
  background:rgba(255,102,0,.92);color:#fff;padding:7px 18px;font-size:.78rem;
  letter-spacing:2px;border-radius:3px;display:none;z-index:50;
  animation:pi .3s ease}
@keyframes pi{from{transform:translateX(-50%) scale(.7);opacity:0}}
</style>
</head>
<body>

<div id="hud-top">
  <div>SCR: <span id="sv" class="hud-g">0</span></div>
  <div id="wave-txt">WAVE 1</div>
  <div id="streak-alert">📡 UAV ACTIVE</div>
  <div>×<span id="stv" class="hud-g">0</span></div>
</div>

<div id="game-area"><canvas id="gc"></canvas></div>

<div id="hud-bot">
  <div class="hr">
    <span style="font-size:.65rem;color:#888;flex-shrink:0">HP</span>
    <div id="hp-bg"><div id="hp-fill" style="width:100%"></div></div>
    <span id="hp-txt">100</span>
  </div>
  <div class="hr"><div class="wpn-row" id="wpn-row"></div></div>
  <div class="hr">
    <button id="reload-btn" onclick="doReload()">RELOAD</button>
    <button id="nade-btn" onclick="doNade()">💣 ×<span id="nc">3</span></button>
    <span id="ammo-d">M4A1 30/120</span>
  </div>
</div>

<div id="menu-ov" class="overlay">
  <h1>TACTICAL STRIKE</h1>
  <p>SELECT DEPLOYMENT ZONE</p>
  <div class="mb">
    <button style="border-color:#ff3333" onclick="startGame('shipment')">SHIPMENT — CHAOS</button>
    <button style="border-color:#ff9933" onclick="startGame('rust')">RUST — DESERT ARENA</button>
    <button style="border-color:#33aaff" onclick="startGame('crash')">CRASH — URBAN OPS</button>
  </div>
  <p id="hs-disp" style="color:var(--gold);font-size:.72rem;margin-top:6px"></p>
</div>

<div id="wc-ov" class="overlay">
  <h1>WAVE CLEARED</h1>
  <p id="wc-txt"></p>
  <p id="wc-cd" style="color:#aaa;font-size:.8rem">Next wave in 3…</p>
</div>

<div id="go-ov" class="overlay">
  <h1>K.I.A.</h1>
  <p>YOU WERE ELIMINATED IN ACTION</p>
  <p>WAVE <span id="go-w" class="hud-g">1</span> &nbsp;·&nbsp; SCORE <span id="go-s" class="hud-g">0</span></p>
  <button class="ob" onclick="goMenu()">RETURN TO BASE</button>
</div>

<div id="spop"></div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const WPNS=[
  {id:'m4',   n:'M4A1',   ma:30, res:120, fr:120, dmg:34, rng:440, t:'auto',  rl:1200, sp:.04, ul:1},
  {id:'mp5',  n:'MP5K',   ma:35, res:140, fr:80,  dmg:24, rng:280, t:'auto',  rl:900,  sp:.07, ul:1},
  {id:'r870', n:'R870',   ma:8,  res:32,  fr:750, dmg:20, rng:160, t:'spread',rl:1800, sp:.18, ul:3},
  {id:'snp',  n:'.50CAL', ma:5,  res:20,  fr:1100,dmg:110,rng:900, t:'bolt',  rl:2200, sp:.01, ul:5},
  {id:'rpg',  n:'RPG-7',  ma:3,  res:9,   fr:2000,dmg:180,rng:520, t:'expl',  rl:3000, sp:.02, ul:8},
];

const ETYPES=[
  {k:'grunt', hp:100,spd:75, r:13,c:'#bb2000',o:'#ff4422',sc:100,dmg:20},
  {k:'rush',  hp:60, spd:165,r:11,c:'#cc6600',o:'#ff8800',sc:150,dmg:14},
  {k:'heavy', hp:320,spd:40, r:20,c:'#880000',o:'#bb0000',sc:350,dmg:32},
  {k:'elite', hp:180,spd:98, r:14,c:'#6600aa',o:'#9900dd',sc:250,dmg:24,sh:true},
  {k:'jugg',  hp:700,spd:28, r:26,c:'#550011',o:'#880022',sc:1000,dmg:50,boss:true},
];

const MAPS={
  shipment:{fl:'#1e2228',walls:[[.08,.12,.13,.1],[.64,.12,.13,.1],[.08,.64,.13,.1],[.64,.64,.13,.1],[.38,.38,.24,.12],[.08,.38,.1,.12],[.7,.38,.1,.12]]},
  rust:    {fl:'#2c1e14',walls:[[.32,.3,.36,.28],[.04,.04,.1,.15],[.86,.04,.1,.15],[.04,.8,.1,.12],[.86,.8,.1,.12]]},
  crash:   {fl:'#161820',walls:[[0,.26,.4,.07],[.6,.26,.4,.07],[0,.58,.35,.07],[.65,.58,.35,.07],[.43,.04,.07,.28],[.43,.6,.07,.28]]},
};

// ─── CANVAS ──────────────────────────────────────────────────────────────────
const cv=document.getElementById('gc'), cx=cv.getContext('2d');

function resize(){
  const a=document.getElementById('game-area');
  cv.width=a.clientWidth; cv.height=a.clientHeight;
  if(G&&G.on) buildWalls();
}
window.addEventListener('resize',resize);

// ─── STATE ───────────────────────────────────────────────────────────────────
let G={on:false};

function freshWpns(){return WPNS.map(w=>({...w,ammo:w.ma,reserve:w.res}));}

function initState(map){
  G={
    on:false, map,
    wave:1, wTot:8, wKill:0, wSpawn:0,
    spT:0, spI:1.4, between:false,
    score:0, streak:0, lifekills:0,

    px:0,py:0, pface:0,
    hp:100, maxhp:100,

    wpns:freshWpns(), wi:0, reloading:false, lastFire:0,
    nades:3,

    uav:false, uavEnd:0,
    chop:false, chopEnd:0, chopT:0,

    enemies:[], bullets:[], parts:[], hmarks:[], dnums:[],
    walls:[],

    shX:0,shY:0,shDur:0,shAmt:0,
    vig:0,
  };
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const rn=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const d2=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function circbox(cx,cy,r,w){
  return d2(cx,cy,cl(cx,w.x,w.x+w.w),cl(cy,w.y,w.y+w.h))<r;
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
let AC=null;
function initAC(){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function bip(f,d,v=.1,t='sawtooth'){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);o.type=t;
    o.frequency.setValueAtTime(f,AC.currentTime);
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.start();o.stop(AC.currentTime+d);}catch(e){}
}
function sfx(t){
  switch(t){
    case 'fire':  bip(180,.07,.12,'sawtooth');break;
    case 'snp':   bip(90,.2,.18,'sawtooth');break;
    case 'shot':  for(let i=0;i<3;i++)setTimeout(()=>bip(150+rn(-20,20),.07,.1,'sawtooth'),i*18);break;
    case 'nade':  bip(80,.4,.2,'sawtooth');setTimeout(()=>bip(60,.5,.18,'sine'),100);break;
    case 'hit':   bip(440,.04,.1,'square');break;
    case 'kill':  bip(660,.07,.1,'sine');setTimeout(()=>bip(880,.1,.1,'sine'),85);break;
    case 'rl':    bip(350,.07,.1,'square');setTimeout(()=>bip(450,.06,.08,'square'),120);break;
    case 'empty': bip(200,.05,.15,'square');break;
    case 'wave':  [440,550,660].forEach((f,i)=>setTimeout(()=>bip(f,.15,.14,'sine'),i*120));break;
    case 'over':  [300,220,160].forEach((f,i)=>setTimeout(()=>bip(f,.3,.15,'sawtooth'),i*200));break;
    case 'str':   bip(550,.1,.14,'sine');setTimeout(()=>bip(770,.14,.14,'sine'),110);break;
    case 'rpg':   bip(60,.5,.24,'sawtooth');setTimeout(()=>bip(40,.7,.18,'sine'),200);break;
  }
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
let LS={on:false,bx:0,by:0,cx:0,cy:0,id:null};

function touchXY(t){const r=cv.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}

cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!G.on)return;
  if(!AC)initAC();
  for(const t of e.changedTouches){
    const{x,y}=touchXY(t);
    if(x<cv.width*.46&&!LS.on){
      LS={on:true,bx:x,by:y,cx:x,cy:y,id:t.identifier};
    }
  }
},{passive:false});

cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)
    if(t.identifier===LS.id){const{x,y}=touchXY(t);LS.cx=x;LS.cy=y;}
},{passive:false});

cv.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)
    if(t.identifier===LS.id){LS.on=false;LS.id=null;}
},{passive:false});

// ─── WALLS ───────────────────────────────────────────────────────────────────
function buildWalls(){
  const w=cv.width,h=cv.height,def=MAPS[G.map];
  G.walls=def.walls.map(([px,py,pw,ph])=>({x:px*w,y:py*h,w:pw*w,h:ph*h}));
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
function part(x,y,col,n=4){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=rn(30,110);
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,al:1,blast:false});
  }
}
function explode(x,y){
  part(x,y,'#ff6600',12);part(x,y,'#ffcc00',6);
  G.parts.push({x,y,vx:0,vy:0,col:'#ff6600',al:1,blast:true,r:8});
  doShake(6,.3);
}
function dnum(x,y,txt,col='#fff'){G.dnums.push({x,y,vy:-55,txt,col,al:1});}
function doShake(a,d){G.shAmt=a;G.shDur=d;}

// ─── FIRE ────────────────────────────────────────────────────────────────────
function fireat(e,now){
  const w=G.wpns[G.wi];
  if(w.ammo<=0){sfx('empty');doReload();return;}
  if(now-G.lastFire<w.fr)return;
  G.lastFire=now; w.ammo--; updateHUD();
  const ang=Math.atan2(e.y-G.py,e.x-G.px);
  G.pface=ang;
  if(w.t==='spread'){
    sfx('shot');
    for(let i=-3;i<=3;i++) mkbullet(ang+i*.15+(Math.random()-.5)*.05,w.dmg,w.rng,w.t);
  } else if(w.t==='expl'){
    sfx('rpg'); mkbullet(ang+(Math.random()-.5)*w.sp,w.dmg,w.rng,w.t);
  } else {
    sfx(w.t==='bolt'?'snp':'fire'); mkbullet(ang+(Math.random()-.5)*w.sp,w.dmg,w.rng,w.t);
  }
}
function mkbullet(a,dmg,rng,t){
  const spd=t==='bolt'?920:t==='expl'?300:700;
  G.bullets.push({x:G.px,y:G.py,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
    dmg,rng,tr:0,t,col:t==='expl'?'#ff9900':t==='bolt'?'#88ddff':'#ffe880'});
}

function doReload(){
  if(G.reloading)return;
  const w=G.wpns[G.wi];
  if(w.ammo===w.ma||w.reserve<=0)return;
  G.reloading=true; sfx('rl');
  document.getElementById('reload-btn').textContent='…';
  setTimeout(()=>{
    if(!G.on){G.reloading=false;return;}
    const n=Math.min(w.ma-w.ammo,w.reserve);
    w.ammo+=n;w.reserve-=n;G.reloading=false;
    document.getElementById('reload-btn').textContent='RELOAD';
    updateHUD();
  },w.rl);
}

function doNade(){
  if(G.nades<=0||!G.on)return;
  G.nades--;document.getElementById('nc').textContent=G.nades;sfx('nade');
  if(!G.enemies.length)return;
  const cx=G.enemies.reduce((s,e)=>s+e.x,0)/G.enemies.length;
  const cy=G.enemies.reduce((s,e)=>s+e.y,0)/G.enemies.length;
  [0,1,2,3].forEach(i=>setTimeout(()=>{
    if(!G.on)return;
    const ex=cx+(Math.random()-.5)*90,ey=cy+(Math.random()-.5)*90;
    explode(ex,ey);
    G.enemies.forEach(e=>{
      if(e.hp>0&&d2(ex,ey,e.x,e.y)<95){
        const dmg=rn(60,105);e.hp-=dmg;
        dnum(e.x,e.y-10,dmg,'#ff9900');
        if(e.hp<=0)killE(e);
      }
    });
    G.enemies=G.enemies.filter(e=>e.hp>0);
  },i*130));
}

// ─── KILL / STREAK ───────────────────────────────────────────────────────────
function killE(e){
  G.streak++;G.lifekills++;G.wKill++;
  G.score=Math.round(G.score+e.sc*(1+Math.floor(G.streak/5)*.1));
  sfx('kill'); part(e.x,e.y,e.c,6); dnum(e.x,e.y,'×'+G.streak,'#ffd700');
  document.getElementById('sv').textContent=G.score;
  document.getElementById('stv').textContent=G.streak;
  checkStreak();
  if(G.wKill>=G.wTot&&!G.enemies.some(en=>en.hp>0)) setTimeout(waveDone,500);
}

function popup(msg){
  sfx('str');const el=document.getElementById('spop');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>el.style.display='none',2400);
}

function checkStreak(){
  const s=G.lifekills;
  if(s===5){G.uav=true;G.uavEnd=performance.now()+12000;
    document.getElementById('streak-alert').style.display='inline';
    popup('📡 UAV ONLINE — ENEMIES REVEALED');}
  if(s===7){G.hp=cl(G.hp+50,0,G.maxhp);G.wpns[G.wi].ammo=G.wpns[G.wi].ma;
    popup('📦 CARE PACKAGE — +50HP FULL AMMO');}
  if(s===10) airstrike();
  if(s===15||( s>15&&(s-15)%8===0)){G.chop=true;G.chopEnd=performance.now()+8000;G.chopT=0;
    popup('🚁 CHOPPER GUNNER — 8 SECONDS');}
}

function airstrike(){
  popup('✈️ AIRSTRIKE INBOUND');
  const cw=cv.width,ch=cv.height;
  for(let i=0;i<9;i++) setTimeout(()=>{
    if(!G.on)return;
    const bx=rn(cw*.1,cw*.9),by=rn(ch*.1,ch*.9);
    explode(bx,by);
    G.enemies.forEach(e=>{if(e.hp>0&&d2(bx,by,e.x,e.y)<110){e.hp-=rn(80,140);if(e.hp<=0)killE(e);}});
    G.enemies=G.enemies.filter(e=>e.hp>0);
  },i*280);
}

// ─── SPAWN ───────────────────────────────────────────────────────────────────
function pickType(){
  const w=G.wave,pool=[ETYPES[0]];
  if(w>=2)pool.push(ETYPES[1]);
  if(w>=3)pool.push(ETYPES[2]);
  if(w>=4)pool.push(ETYPES[3]);
  if(w%5===0&&G.wSpawn===0)return ETYPES[4];
  return pool[Math.floor(Math.random()*pool.length)];
}

function spawnE(){
  const tp=pickType();
  let x,y;
  if(Math.random()<.5){x=Math.random()<.5?-30:cv.width+30;y=Math.random()*cv.height;}
  else{x=Math.random()*cv.width;y=Math.random()<.5?-30:cv.height+30;}
  G.enemies.push({...tp,hp:tp.hp,maxhp:tp.hp,x,y,
    spd:tp.spd*(1+G.wave*.04),ang:0,lastSh:0,id:Math.random()});
  G.wSpawn++;
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
function update(dt,now){
  // shake
  if(G.shDur>0){G.shDur-=dt;G.shX=(Math.random()-.5)*G.shAmt*2;G.shY=(Math.random()-.5)*G.shAmt*2;}
  else{G.shX=0;G.shY=0;}
  if(G.vig>0)G.vig=Math.max(0,G.vig-dt*2.2);

  // UAV expire
  if(G.uav&&now>G.uavEnd){G.uav=false;document.getElementById('streak-alert').style.display='none';}

  // Chopper
  if(G.chop){
    if(now>G.chopEnd){G.chop=false;}
    else{
      G.chopT+=dt;
      if(G.chopT>.18&&G.enemies.length){
        G.chopT=0;
        const t=G.enemies[Math.floor(Math.random()*G.enemies.length)];
        if(t&&t.hp>0){const d=rn(30,55);t.hp-=d;dnum(t.x,t.y-8,d,'#33ccff');part(t.x,t.y,'#33ccff',2);if(t.hp<=0)killE(t);}
      }
    }
  }

  // Player movement
  if(LS.on){
    const dx=LS.cx-LS.bx,dy=LS.cy-LS.by,len=Math.hypot(dx,dy);
    if(len>6){
      const f=Math.min(len,62)/62,spd=165*(1+G.wave*.02);
      const nx=dx/len,ny=dy/len;
      const r=16;
      let npx=cl(G.px+nx*spd*f*dt,r,cv.width-r);
      let npy=cl(G.py+ny*spd*f*dt,r,cv.height-r);
      let cx2=false,cy2=false;
      G.walls.forEach(w=>{if(circbox(npx,G.py,r,w))cx2=true;if(circbox(G.px,npy,r,w))cy2=true;});
      if(!cx2)G.px=npx; if(!cy2)G.py=npy;
    }
  }

  // Spawn
  if(G.wSpawn<G.wTot){G.spT+=dt;if(G.spT>=G.spI){G.spT=0;spawnE();}}

  // Enemies
  let close=null,closeDist=Infinity;
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.hp<=0){G.enemies.splice(i,1);continue;}
    const edx=G.px-e.x,edy=G.py-e.y,ed=Math.hypot(edx,edy);
    e.x+=(edx/ed)*e.spd*dt; e.y+=(edy/ed)*e.spd*dt;
    e.ang=Math.atan2(edy,edx);
    // wall push
    G.walls.forEach(w=>{
      if(circbox(e.x,e.y,e.r,w)){
        const ccx=w.x+w.w/2,ccy=w.y+w.h/2;
        const al=Math.hypot(e.x-ccx,e.y-ccy)||1;
        e.x+=(e.x-ccx)/al*3;e.y+=(e.y-ccy)/al*3;
      }
    });
    // melee
    if(ed<16+e.r){G.hp-=e.dmg*dt;G.vig=1;doShake(4,.12);if(G.hp<=0){doGameOver();return;}}
    // elite shoot
    if(e.sh&&now-e.lastSh>2000){
      e.lastSh=now;
      const a=Math.atan2(G.py-e.y,G.px-e.x)+(Math.random()-.5)*.22;
      G.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*380,vy:Math.sin(a)*380,dmg:e.dmg*.5,rng:360,tr:0,t:'enemy',col:'#ff00ff',isE:true});
    }
    if(ed<closeDist){closeDist=ed;close=e;}
  }

  // Auto-fire
  if(close&&!G.reloading&&closeDist<=G.wpns[G.wi].rng) fireat(close,now);

  // Bullets
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.tr+=Math.hypot(b.vx*dt,b.vy*dt);
    let dead=b.tr>b.rng||b.x<-60||b.x>cv.width+60||b.y<-60||b.y>cv.height+60;
    if(!dead) G.walls.forEach(w=>{if(b.x>=w.x&&b.x<=w.x+w.w&&b.y>=w.y&&b.y<=w.y+w.h){dead=true;part(b.x,b.y,'#888',2);}});
    if(!dead){
      if(b.isE){
        if(d2(b.x,b.y,G.px,G.py)<16){G.hp-=b.dmg;G.vig=.8;doShake(3,.18);dead=true;sfx('hit');if(G.hp<=0){doGameOver();return;}}
      } else {
        for(let j=G.enemies.length-1;j>=0;j--){
          const e=G.enemies[j];if(e.hp<=0)continue;
          if(d2(b.x,b.y,e.x,e.y)<e.r){
            if(b.t==='expl'){
              explode(b.x,b.y);
              G.enemies.forEach(te=>{if(te.hp>0&&d2(b.x,b.y,te.x,te.y)<100){const d=rn(Math.round(b.dmg*.6),b.dmg);te.hp-=d;dnum(te.x,te.y-10,d,'#ff9900');G.hmarks.push({x:te.x,y:te.y,al:1});if(te.hp<=0)killE(te);}});
              G.enemies=G.enemies.filter(e=>e.hp>0);
            } else {
              e.hp-=b.dmg;dnum(e.x,e.y-8,Math.round(b.dmg),'#fff');
              G.hmarks.push({x:e.x,y:e.y,al:1});part(e.x,e.y,'#aa2200',3);
              if(e.hp<=0)killE(e);
            }
            dead=true;break;
          }
        }
      }
    }
    if(dead)G.bullets.splice(i,1);
  }

  // Particles
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.blast)p.r=Math.min(p.r+85*dt,65);
    p.al-=dt*(p.blast?2.5:1.6);if(p.al<=0)G.parts.splice(i,1);
  }
  for(let i=G.dnums.length-1;i>=0;i--){const d=G.dnums[i];d.y+=d.vy*dt;d.al-=dt*1.6;if(d.al<=0)G.dnums.splice(i,1);}
  for(let i=G.hmarks.length-1;i>=0;i--){G.hmarks[i].al-=dt*5;if(G.hmarks[i].al<=0)G.hmarks.splice(i,1);}

  // HP HUD
  const hp=cl(G.hp,0,G.maxhp);
  document.getElementById('hp-fill').style.width=(hp/G.maxhp*100)+'%';
  document.getElementById('hp-fill').style.background=hp<30?'#ff3333':hp<60?'#ffaa00':'linear-gradient(90deg,#22aa44,#33cc55)';
  document.getElementById('hp-txt').textContent=Math.ceil(hp);
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render(){
  const w=cv.width,h=cv.height,def=MAPS[G.map];
  cx.save();cx.translate(G.shX,G.shY);

  // Ground + grid
  cx.fillStyle=def.fl;cx.fillRect(0,0,w,h);
  cx.strokeStyle='rgba(255,255,255,.025)';cx.lineWidth=1;
  for(let x=0;x<w;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,h);cx.stroke();}
  for(let y=0;y<h;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(w,y);cx.stroke();}

  // Walls (3D look)
  G.walls.forEach(wall=>{
    cx.fillStyle='rgba(0,0,0,.35)';cx.fillRect(wall.x+5,wall.y+5,wall.w,wall.h);
    cx.fillStyle='#3a4050';cx.fillRect(wall.x,wall.y,wall.w,wall.h);
    cx.fillStyle='rgba(255,255,255,.07)';cx.fillRect(wall.x,wall.y,wall.w,4);
    cx.strokeStyle='#505a6a';cx.lineWidth=1.5;cx.strokeRect(wall.x,wall.y,wall.w,wall.h);
  });

  // Particles
  G.parts.forEach(p=>{
    cx.save();cx.globalAlpha=Math.max(0,p.al);
    if(p.blast){
      const g2=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g2.addColorStop(0,'rgba(255,200,50,.8)');g2.addColorStop(1,'rgba(255,50,0,0)');
      cx.fillStyle=g2;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();
    } else {cx.fillStyle=p.col;cx.fillRect(p.x,p.y,4,4);}
    cx.restore();
  });

  // Bullets with glow
  G.bullets.forEach(b=>{
    cx.save();cx.globalAlpha=.9;cx.shadowBlur=8;cx.shadowColor=b.col;
    cx.fillStyle=b.col;cx.beginPath();cx.arc(b.x,b.y,b.t==='bolt'?3:b.t==='expl'?4:2,0,Math.PI*2);cx.fill();
    if(b.vx||b.vy){
      const len=b.t==='bolt'?22:9,bv=Math.hypot(b.vx,b.vy);
      cx.strokeStyle=b.col;cx.lineWidth=b.t==='bolt'?2:1;
      cx.beginPath();cx.moveTo(b.x,b.y);cx.lineTo(b.x-(b.vx/bv)*len,b.y-(b.vy/bv)*len);cx.stroke();
    }
    cx.restore();
  });

  // Enemies
  G.enemies.forEach(e=>{
    if(e.hp<=0)return;
    cx.save();
    if(G.uav){cx.strokeStyle='rgba(255,80,80,.28)';cx.lineWidth=1;cx.setLineDash([3,5]);cx.beginPath();cx.arc(e.x,e.y,e.r+14,0,Math.PI*2);cx.stroke();cx.setLineDash([]);}
    cx.fillStyle=e.c;cx.beginPath();cx.arc(e.x,e.y,e.r,0,Math.PI*2);cx.fill();
    cx.strokeStyle=e.o;cx.lineWidth=2;cx.stroke();
    if(e.boss){cx.strokeStyle='rgba(255,100,100,.6)';cx.lineWidth=3;cx.beginPath();cx.arc(e.x,e.y,e.r+7,0,Math.PI*2);cx.stroke();}
    // facing dot
    cx.fillStyle='rgba(255,255,255,.55)';cx.beginPath();
    cx.arc(e.x+Math.cos(e.ang)*e.r*.7,e.y+Math.sin(e.ang)*e.r*.7,3,0,Math.PI*2);cx.fill();
    // hp bar
    const bw=e.r*2.6,bx=e.x-bw/2,by=e.y-e.r-11;
    cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(bx,by,bw,4);
    const hp=e.hp/e.maxhp;
    cx.fillStyle=hp>.5?'#33cc44':hp>.25?'#ffaa00':'#ff3333';
    cx.fillRect(bx,by,bw*hp,4);
    cx.restore();
  });

  // Player
  cx.save();cx.translate(G.px,G.py);
  const hpA=(cl(G.hp,0,G.maxhp)/G.maxhp)*Math.PI*2;
  cx.strokeStyle='rgba(50,200,80,.35)';cx.lineWidth=3;
  cx.beginPath();cx.arc(0,0,20,-Math.PI/2,-Math.PI/2+hpA);cx.stroke();
  cx.fillStyle='#33cc55';cx.beginPath();cx.arc(0,0,14,0,Math.PI*2);cx.fill();
  cx.strokeStyle='#ffffff';cx.lineWidth=2;cx.stroke();
  cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.cos(G.pface)*19,Math.sin(G.pface)*19);cx.stroke();
  cx.restore();

  // Hitmarkers
  G.hmarks.forEach(h=>{
    cx.save();cx.globalAlpha=h.al;cx.strokeStyle='#fff';cx.lineWidth=2;
    const s=7;cx.beginPath();cx.moveTo(h.x-s,h.y-s);cx.lineTo(h.x+s,h.y+s);cx.moveTo(h.x+s,h.y-s);cx.lineTo(h.x-s,h.y+s);cx.stroke();cx.restore();
  });

  // Damage numbers
  G.dnums.forEach(d=>{
    cx.save();cx.globalAlpha=d.al;cx.fillStyle=d.col;
    cx.font='bold 14px Arial Black';cx.textAlign='center';cx.fillText(d.txt,d.x,d.y);cx.restore();
  });

  // Virtual joystick
  if(LS.on){
    const dx=LS.cx-LS.bx,dy=LS.cy-LS.by;
    const len=Math.min(Math.hypot(dx,dy),62),ang=Math.atan2(dy,dx);
    cx.save();cx.globalAlpha=.22;cx.strokeStyle='#fff';cx.lineWidth=2;
    cx.beginPath();cx.arc(LS.bx,LS.by,62,0,Math.PI*2);cx.stroke();
    cx.globalAlpha=.42;cx.fillStyle='#fff';cx.beginPath();
    cx.arc(LS.bx+Math.cos(ang)*len,LS.by+Math.sin(ang)*len,22,0,Math.PI*2);cx.fill();
    cx.restore();
  }

  // Minimap
  const mw=86,mh=66,mx2=w-mw-8,my2=8;
  cx.save();cx.globalAlpha=.72;
  cx.fillStyle='rgba(0,0,0,.7)';cx.strokeStyle='rgba(255,255,255,.18)';cx.lineWidth=1;
  cx.fillRect(mx2,my2,mw,mh);cx.strokeRect(mx2,my2,mw,mh);
  const sx=mw/w,sy=mh/h;
  cx.fillStyle='#3a4050';
  G.walls.forEach(wl=>cx.fillRect(mx2+wl.x*sx,my2+wl.y*sy,wl.w*sx,wl.h*sy));
  G.enemies.forEach(e=>{
    if(e.hp<=0)return;
    cx.fillStyle=G.uav?'#ff3333':'rgba(255,80,80,.65)';
    cx.beginPath();cx.arc(mx2+e.x*sx,my2+e.y*sy,2,0,Math.PI*2);cx.fill();
  });
  cx.fillStyle='#33cc55';cx.beginPath();cx.arc(mx2+G.px*sx,my2+G.py*sy,3,0,Math.PI*2);cx.fill();
  cx.restore();

  // Damage vignette
  if(G.vig>0){
    const g3=cx.createRadialGradient(w/2,h/2,h*.28,w/2,h/2,h*.72);
    g3.addColorStop(0,'rgba(255,0,0,0)');g3.addColorStop(1,`rgba(255,0,0,${G.vig*.45})`);
    cx.fillStyle=g3;cx.fillRect(0,0,w,h);
  }

  cx.restore();
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function updateHUD(){
  const w=G.wpns[G.wi];
  document.getElementById('ammo-d').textContent=`${w.n} ${w.ammo}/${w.reserve}`;
}

function buildWpnBtns(){
  const row=document.getElementById('wpn-row');row.innerHTML='';
  WPNS.forEach((wd,i)=>{
    const b=document.createElement('button');b.className='wb';
    const locked=G.wave<wd.ul;
    if(locked)b.classList.add('lk');
    if(i===G.wi)b.classList.add('on');
    b.textContent=wd.n;
    b.onclick=()=>{
      if(locked||G.reloading)return;
      G.wi=i;G.reloading=false;
      document.getElementById('reload-btn').textContent='RELOAD';
      buildWpnBtns();updateHUD();
    };
    row.appendChild(b);
  });
}

// ─── WAVE ────────────────────────────────────────────────────────────────────
function waveDone(){
  if(G.between||!G.on)return;
  G.between=true;G.on=false;
  const bonus=G.wave*500;G.score+=bonus;sfx('wave');
  document.getElementById('wc-txt').textContent=`Wave ${G.wave} cleared. +${bonus} XP bonus.`;
  document.getElementById('wc-ov').style.display='flex';
  let cd=3;
  const iv=setInterval(()=>{
    cd--;document.getElementById('wc-cd').textContent=`Next wave in ${cd}…`;
    if(cd<=0){clearInterval(iv);document.getElementById('wc-ov').style.display='none';nextWave();}
  },1000);
}

function nextWave(){
  G.wave++;G.wTot=8+G.wave*4;G.wKill=0;G.wSpawn=0;
  G.spI=Math.max(.45,1.4-G.wave*.05);G.enemies=[];G.between=false;G.on=true;
  G.streak=0;G.lifekills=0;
  document.getElementById('stv').textContent='0';
  document.getElementById('wave-txt').textContent=`WAVE ${G.wave}`;
  G.hp=cl(G.hp+20,0,G.maxhp);
  buildWpnBtns();
}

// ─── GAME OVER ───────────────────────────────────────────────────────────────
function doGameOver(){
  if(!G.on)return;
  G.on=false;sfx('over');
  const hs=parseInt(localStorage.getItem('ts_hs')||'0');
  if(G.score>hs)localStorage.setItem('ts_hs',G.score);
  document.getElementById('go-w').textContent=G.wave;
  document.getElementById('go-s').textContent=G.score.toLocaleString();
  document.getElementById('go-ov').style.display='flex';
  refreshHS();
}

function refreshHS(){
  const hs=parseInt(localStorage.getItem('ts_hs')||'0');
  document.getElementById('hs-disp').textContent=hs>0?`BEST SCORE: ${hs.toLocaleString()}`:'';
}

function goMenu(){
  document.getElementById('go-ov').style.display='none';
  document.getElementById('wc-ov').style.display='none';
  document.getElementById('menu-ov').style.display='flex';
  refreshHS();
}

// ─── GAME LOOP ───────────────────────────────────────────────────────────────
let lastT=0;
function loop(now){
  if(G.on){
    const dt=Math.min((now-lastT)/1000,.1);
    lastT=now;update(dt,now);render();
  } else if(G.map){
    render(); // keep rendering even when paused (between waves)
  }
  requestAnimationFrame(loop);
}

// ─── START ───────────────────────────────────────────────────────────────────
function startGame(map){
  if(!AC)initAC();
  ['menu-ov','go-ov','wc-ov'].forEach(id=>document.getElementById(id).style.display='none');
  initState(map);resize();
  G.px=cv.width/2;G.py=cv.height/2;G.on=true;
  buildWpnBtns();updateHUD();
  document.getElementById('sv').textContent='0';
  document.getElementById('stv').textContent='0';
  document.getElementById('wave-txt').textContent='WAVE 1';
  document.getElementById('nc').textContent='3';
  document.getElementById('streak-alert').style.display='none';
  document.getElementById('reload-btn').textContent='RELOAD';
  lastT=performance.now();
}

resize();
refreshHS();
requestAnimationFrame(loop);
</script>
